<h1>小G · 自然待机</h1>
<p>自然待机时，偶尔轻轻看看四周、踮踮脚、揉揉眼或想一想。你靠近脑袋、打开菜单或正在说话时，她会推迟自己的小动作；专注计时期间暂停自发动作。</p>
<div class="clips">
<article class="card"><h2>看看四周</h2><img src="看看四周.webp" alt="小G轻轻看向一边，再缓缓回正"><p>轻轻转向、稍作停留，再回正。</p></article>
<article class="card"><h2>小憩与叫醒</h2><img src="小憩与叫醒.webp" alt="小G慢慢闭眼，淡紫色的z飘起，随后睁眼"><p>右键 → 待机陪伴 → 让小G小憩一下。<br>点击、拖动或菜单都可以叫醒。</p></article>
</div>
<p><small>这里是用程序实际绘图方法导出的30次/秒循环预览；实际待机小动作间隔约22～46秒，小憩会持续到你叫醒。预览中缩短了间隔与休息时间。</small></p>
