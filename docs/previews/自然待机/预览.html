<h1>小G · 陪伴与休息</h1>
<p>右键 → 陪伴模式，统一选择自然陪伴、安静陪伴或休息。自然陪伴偶尔看看四周、踮脚、揉眼或思考；安静陪伴保留眨眼和注视；休息缓缓闭眼。专注计时也在同一处，计时期间暂停自发动作，到时唤醒提醒。</p>
<div class="clips">
<article class="card"><h2>看看四周</h2><img src="看看四周.webp" alt="小G轻轻看向一边，再缓缓回正"><p>轻轻转向、稍作停留，再回正。</p></article>
<article class="card"><h2>休息 → 自然陪伴</h2><img src="小憩与叫醒.webp" alt="小G慢慢闭眼，淡紫色的z缓缓飘起，切换陪伴后睁眼"><p>切回陪伴会渐渐睁眼，恢复眨眼与注视。</p></article>
<article class="card"><h2>半闭眼时反复改选</h2><img src="模式切换.webp" alt="半闭眼时切回陪伴、改为休息再切陪伴，眼睑连续过渡"><p>从当前眼睛的位置接着开合，不闪回闭眼图。</p></article>
</div>
<p><small>程序实际模式切换与绘图方法的30次/秒预览，缩短了等待时间。平时轻动作间隔约22～46秒，完整小动作至少间隔70秒；久未互动时更安静。休息持续到你叫醒，退出后不保持闭眼。</small></p>
</main>
